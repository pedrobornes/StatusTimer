server:
  port: ${PORT:8080}

spring:
  application:
    name: statustimer-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

app:
  security:
    api-key: ${APP_API_KEY:your-local-secret-key}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

telemetry:
  history:
    heartbeat-minutes-tier-1: 30
    heartbeat-minutes-tier-2: 60
    heartbeat-minutes-tier-3: 120
    retention-hours: 72
    purge-batch-size: 500
    purge-interval-ms: 3600000
  rollup:
    retention-days: 90
    minimum-samples: 5

harvest:
  schedule:
    max-telemetry-per-cycle: 50
    max-metrics-per-cycle: 50
    # Visited CATALOG Steam/Twitch profiles (not the whole Steam store).
    max-catalog-metrics-per-cycle: 15
    max-news-per-cycle: 20
    max-catalog-news-per-cycle: 10
    catalog-metrics-freshness-minutes: 60
    catalog-news-freshness-minutes: 360
    telemetry-minutes-tier-1: 10
    telemetry-minutes-tier-2: 90
    telemetry-minutes-tier-3: 360
    metrics-minutes-tier-1: 22
    metrics-minutes-tier-2: 90
    metrics-minutes-tier-3: 900
    news-minutes-tier-1: 480
    news-minutes-tier-2: 2160
    news-minutes-tier-3: 10080
    failed-retry-minutes: 5

indexability:
  monitoring-age-hours: 48
  freshness-hours-tier-1: 24
  freshness-hours-tier-2: 48
  freshness-hours-tier-3: 72
  guardian-interval-ms: 900000
  api-outage-grace-hours: 1
  # CATALOG Steam launches need this Twitch floor (or a livePlayers sample) to enter index.
  launch-twitch-viewers-threshold: 5000
  # After entry, keep indexable this many days even if viewers drop below the floor.
  launch-index-grace-days: 14

lifecycle:
  monitor:
    # Hard cap on MONITORED + INDEXABLE games (harvest workload). Remaining catalog stays CATALOG.
    max-monitored-games: 500
    demote-inactivity-days: 30
    promote-max-per-cycle: 25

igdb:
  client-id: ${IGDB_CLIENT_ID:}
  client-secret: ${IGDB_CLIENT_SECRET:}
  search-limit: ${IGDB_SEARCH_LIMIT:8}
