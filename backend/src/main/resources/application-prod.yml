spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:statustimer}}?useSSL=true&requireSSL=true&serverTimezone=UTC}
    username: ${DB_USER:${MYSQLUSER:statustimer}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL/proxy often closes idle sockets before Hikari's default maxLifetime (30m).
      # Keep lifetime below typical wait_timeout and refresh idle connections early.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 480000
      keepalive-time: 60000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:https://status-timer.com,https://www.status-timer.com}

logging:
  level:
    root: INFO
    com.statustimer: INFO
